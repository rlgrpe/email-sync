[package]
name = "email-sync"
version = "0.1.1"
edition = "2021"
description = "Async IMAP email client for monitoring and pattern matching"
license = "MIT"
repository = "https://github.com/rlgrpe/email-sync"
keywords = ["imap", "email", "async", "tokio"]
categories = ["email", "asynchronous", "network-programming"]

[features]
default = ["tls-ring"]
# TLS crypto backend (enable exactly one)
tls-ring = ["rustls/ring"]
tls-aws-lc-rs = ["rustls/aws-lc-rs"]
# Enable OpenTelemetry instrumentation
observability = ["dep:tracing-opentelemetry", "dep:opentelemetry"]

[dependencies]
# Async runtime
tokio = { version = "1.44", features = ["net", "time", "sync", "rt"] }
futures = "0.3"

# IMAP
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
tokio-rustls = "0.26"
webpki-roots = "1.0"

# SOCKS5 proxy
tokio-socks = "0.5"

# Email parsing
mailparse = "0.16"

# Pattern matching
regex = "1.11"

# Date/time
chrono = "0.4"

# Error handling
thiserror = "1.0"

# Validation & Security
secrecy = "0.10"
email_address = "0.2"

# Tracing (always available, spans are no-op without subscriber)
tracing = "0.1"

# Observability (optional)
tracing-opentelemetry = { version = "0.32", optional = true }
opentelemetry = { version = "0.30", optional = true }

[dev-dependencies]
tokio = { version = "1.44", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"

# Examples
[[example]]
name = "basic_otp"
path = "examples/basic_otp.rs"

[[example]]
name = "find_recent"
path = "examples/find_recent.rs"

[[example]]
name = "custom_matcher"
path = "examples/custom_matcher.rs"

[[example]]
name = "with_proxy"
path = "examples/with_proxy.rs"

[[example]]
name = "with_tracing"
path = "examples/with_tracing.rs"

[[example]]
name = "error_handling"
path = "examples/error_handling.rs"
